name: CI

# Checks the contract, not the prose. A convention nobody checks decays into a
# convention nobody follows, which is why docs/module-contract.md ends with an
# enforcement section rather than a promise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements-dev.txt
          pip install --quiet pytest httpx

      - name: The module contract requires these files to exist
        run: |
          missing=""
          for f in README.md LICENSE CHANGELOG.md .gitattributes; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "missing required files:$missing" >&2
            echo "See docs/module-contract.md in the conker repository." >&2
            exit 1
          fi

      - name: Line endings must be LF
        # These services run on Linux. A CRLF in an entrypoint is a "bad
        # interpreter" failure that nothing on a Windows machine surfaces
        # before the container dies.
        run: |
          if git grep -Il $'\r' -- . ; then
            echo "CRLF found in tracked files; .gitattributes should normalise these." >&2
            exit 1
          fi
          echo "all tracked text files are LF"

      - name: Lint
        # Pinned in requirements-dev.txt and configured in ruff.toml, both
        # explicit: a lint set that moves between releases produces diffs
        # nobody asked for. `ruff format` owns code layout and line length.
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests
        run: python -m pytest tests/ --ignore=tests/test_module_contract.py -q

      - name: Browser authority mutation drill
        run: python scripts/auth_mutation_drill.py

      - name: Pi audit mutation drill
        run: python scripts/audit_mutation_drill.py

  contract:
    # The health contract is an HTTP contract, so it is asserted against a
    # running container rather than an in-process app object - the thing that
    # ships is the image, and an in-process check inherits whatever global
    # state earlier tests left behind.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pytest httpx

      - name: Build and start
        run: |
          docker network create conker_net || true
          echo "PI_ADMIN_KEY=ci-only-key-not-a-secret-1234" > .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8050/health" >/dev/null 2>&1; then
              echo "healthy after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "service never became reachable" >&2
          docker compose logs --tail 50
          exit 1

      - name: Module contract
        run: python -m pytest tests/test_module_contract.py -q

      - if: always()
        run: docker compose down -v

  no-secrets-in-the-image:
    # Docker's COPY does not honour .gitignore, so a local .env or a working
    # database can be baked into a published image without a single warning.
    # That has happened here once already, and the fix - a .dockerignore - is
    # exactly the kind of file that silently stops matching when a path moves.
    # So the image is built and searched, rather than trusted.
    #
    # Scoped to /app on purpose. Searching the whole filesystem for "*.pem"
    # matches the OS certificate store, several hundred files that are supposed
    # to be there - and a check that cries wolf is a check somebody turns off.
    # .env.example is excluded for the same reason: it ships deliberately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build -t candidate:ci -f Dockerfile .
          docker build -t terminal-candidate:ci -f Dockerfile.terminal .

      - name: Search it for anything secret
        run: |
          found=$(docker run --rm --entrypoint sh candidate:ci -c \
            'find /app -type f 2>/dev/null' \
            | grep -Ei '/\.env$|/\.env\.[^/]*$|\.db$|\.sqlite[0-9]?$|vault\.key$|/id_[rd]sa$|\.pem$' \
            | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::secrets or state were baked into the image" >&2
            echo "$found" >&2
            echo "" >&2
            echo "Fix the .dockerignore at the ROOT OF THE BUILD CONTEXT (not the repo," >&2
            echo "if those differ). Patterns must be anchored with **/ - a bare '.env'" >&2
            echo "matches only the context root, never a subdirectory." >&2
            exit 1
          fi
          echo "clean: no .env, no database, no key material under /app"

      - name: Dedicated terminal image contains only its runtime
        run: |
          files=$(docker run --rm --entrypoint /bin/sh terminal-candidate:ci -c \
            'find /app -type f -print | sort')
          expected='/app/pi/__init__.py
          /app/pi/owner_terminal.py
          /app/pi/terminal_sidecar.py'
          test "$files" = "$expected"
          uid=$(docker run --rm --entrypoint /usr/bin/id terminal-candidate:ci -u)
          test "$uid" = 65532
          test "$(docker image inspect terminal-candidate:ci --format '{{json .Config.Entrypoint}}')" \
            = '["/usr/local/bin/conker-terminal"]'

      - name: Dedicated terminal image protocol
        run: |
          control="terminal-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workspace="terminal-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="terminal-sidecar-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$control" "$workspace" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$control" >/dev/null
          docker volume create "$workspace" >/dev/null
          docker run -d --name "$container" \
            --network none --read-only --init --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 \
            --memory 256m --cpus 1 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            -e CONKER_TERMINAL_ISOLATED=1 \
            -v "$control:/run/conker-terminal" \
            -v "$workspace:/workspace" \
            terminal-candidate:ci serve \
            --socket /run/conker-terminal/control.sock \
            --health /run/conker-terminal/health.json \
            --shell /bin/bash --workspace /workspace --gateway-uid 65533
          for attempt in $(seq 1 20); do
            if docker exec "$container" conker-terminal health \
              --health /run/conker-terminal/health.json; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 0.25
          done
          docker run --rm --network none --user 65533:65532 \
            -v "$control:/run/conker-terminal" \
            -v "$PWD/scripts/terminal_container_probe.py:/probe.py:ro" \
            --entrypoint python terminal-candidate:ci \
            -I -S /probe.py /run/conker-terminal/control.sock
          test "$(docker wait "$container")" = 0
          test "$(docker inspect "$container" --format '{{.State.Running}}')" = false
